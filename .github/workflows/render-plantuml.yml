name: Render PlantUML

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLANTUML_VERSION: '1.2026.8'
      PLANTUML_LIMIT_SIZE: '32768'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate readable ERD views
        run: node scripts/generate_views.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Korean fonts and PlantUML
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk graphviz
          curl --fail --location --retry 3 \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar" \
            --output "$RUNNER_TEMP/plantuml.jar"

      - name: Validate and render diagrams
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' sources < <(find . -type f -name '*.puml' -not -path './.git/*' -print0)
          if (( ${#sources[@]} == 0 )); then
            echo 'No .puml files found.' >&2
            exit 1
          fi
          java -Djava.awt.headless=true -jar "$RUNNER_TEMP/plantuml.jar" \
            -charset UTF-8 -checkonly "${sources[@]}"
          for source in "${sources[@]}"; do
            relative="${source#./}"
            output="$GITHUB_WORKSPACE/build/plantuml/$(dirname "$relative")"
            mkdir -p "$output"
            for format in svg png; do
              java -Xmx2g -Djava.awt.headless=true -jar "$RUNNER_TEMP/plantuml.jar" \
                -charset UTF-8 -failfast2 "-t${format}" -o "$output" "$source"
            done
          done

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: plantuml-images-${{ github.run_number }}
          path: |
            build/plantuml/**/*.svg
            build/plantuml/**/*.png
          if-no-files-found: error
          retention-days: 30
